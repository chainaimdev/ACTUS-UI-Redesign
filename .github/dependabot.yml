# Dependabot configuration for ACTUS-UI-Redesign
#
# Costs no AI credits - plain GitHub infrastructure.
#
# Deliberate choices:
#  - Major version bumps are IGNORED. They are breaking by definition and
#    need a human to plan them, not an automatic PR. Review majors manually.
#  - Low PR limits. Dependency PRs each trigger CI, which costs Actions
#    minutes. Two open at a time is reviewable; eight is noise.
#  - CI still runs on these PRs on purpose: the whole point is to learn
#    whether a bump breaks the build before it reaches main.
version: 2

updates:
  # ---- Application dependencies (npm / pnpm) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # No automatic major-version bumps for anything.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ---- GitHub Actions used by workflows ----
  # gh-aw pins its own actions inside the generated .lock.yml and refreshes
  # them with `gh aw update`. This block only covers hand-written workflows
  # such as ci.yml. If it ever opens a PR against a .lock.yml, delete it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(actions)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
