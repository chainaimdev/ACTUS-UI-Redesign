# Dependabot configuration for ACTUS-UI-Redesign
#
# Costs no AI credits - plain GitHub infrastructure.
#
# Deliberate choices:
#  - Major version bumps are IGNORED. They are breaking by definition and
#    need a human to plan them, not an automatic PR. Review majors manually.
#  - Low PR limits. Dependency PRs each trigger CI, which costs Actions
#    minutes. Two open at a time is reviewable; eight is noise.
#  - CI still runs on these PRs on purpose: the whole point is to learn
#    whether a bump breaks the build before it reaches main.
version: 2

updates:
  # ---- Application dependencies (npm / pnpm) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # No automatic major-version bumps for anything.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

# ---------------------------------------------------------------------------
# NOTE: the "github-actions" ecosystem is deliberately NOT configured here.
#
# gh-aw generates .github/workflows/*.lock.yml with every action pinned to a
# SHA, and regenerates it on each `gh aw compile`. Dependabot cannot tell the
# generated file from a hand-written one, so it opens PRs against the
# .lock.yml that the next compile silently overwrites. (Observed: PR #10 on
# ACTUS-UI-Redesign, actions/download-artifact 8.0.1 -> 8.0.2.)
#
# Instead:
#   - gh-aw's own actions  -> `gh aw update`, then `gh aw compile`
#   - hand-written ci.yml  -> review actions/checkout and actions/setup-node
#                             manually, roughly once a quarter
# ---------------------------------------------------------------------------
